name: Android
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true
jobs:
  debug:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - name: Install SDK
        run: sdkmanager 'platforms;android-37.0' 'build-tools;36.0.0'
      - uses: gradle/actions/setup-gradle@v4
      - name: Test, lint and build
        run: ./gradlew :app:testDebugUnitTest :app:lintDebug :app:assembleDebug :app:assembleDebugAndroidTest :app:assembleRelease --console=plain
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: glass-tv-debug-and-reports
          path: |
            app/build/outputs/apk/debug/*.apk
            app/build/outputs/apk/release/*.apk
            app/build/outputs/mapping/release/mapping.txt
            app/build/reports/tests/
            app/build/reports/lint-results-debug.*
          retention-days: 14
